<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>La Valle dei Clan - tutte le tessere</title>
<style>
  body { margin: 0; background: #241c15; color: #f4ead8; font: 15px system-ui, sans-serif; }
  canvas { display: block; margin: 0 auto; }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<script src="../giochi/valle.js"></script>
<script>
(() => {
  const dpr = 2, W = 412, TS = 120, GAP = 12, COLS = 3, LH = 46;
  const normal = VE.DECK.filter(d => !d.sp), special = VE.DECK.filter(d => d.sp);
  const SPN = { falo: 'Falo\': scaccia gli orsi dal prato', miele: 'Alveare: +2 al bosco chiuso', bis: 'Bisonte: 2 punti, l\'orso non lo mangia', pietre: 'Cerchio di pietre: conta solo il cacciatore messo qui' };
  const rows = a => Math.ceil(a.length / COLS);
  const H = 70 + rows(normal) * (TS + LH) + 60 + rows(special) * (TS + LH) + 150;
  const cv = document.getElementById('cv'); cv.width = W * dpr; cv.height = H * dpr; cv.style.width = W + 'px'; cv.style.height = H + 'px';
  const g = cv.getContext('2d'); g.scale(dpr, dpr);
  g.fillStyle = '#241c15'; g.fillRect(0, 0, W, H);
  const AN = { cav: 'cavallo', rin: 'rinoceronte', orso: 'orso', bis: 'bisonte' };
  const desc = d => {
    const F = VE.feats(d).F, out = [];
    const nb = F.filter(f => f.k === 'b').length; if (nb) out.push(nb === 1 ? 'bosco' : nb + ' boschi');
    if (F.some(f => f.k === 'b' && f.amber)) out.push('ambra');
    const L = F.find(f => f.k === 'l'); if (L) out.push('lago ' + L.fish + (L.fish > 1 ? ' pesci' : ' pesce'));
    const rv = d.rv || []; if (rv.some(z => z.end === 'b')) out.push('nasce nel bosco');
    else if (rv.length && !L) out.push(rv.length > 1 ? rv.length + ' fiumi' : 'fiume');
    const a = {}; for (const f of F) if (f.k === 'p') for (const k in AN) if (f[k]) a[k] = (a[k] || 0) + f[k];
    const PL = { cav: 'cavalli', rin: 'rinoceronti', orso: 'orsi', bis: 'bisonti' };
    for (const k in a) out.push(a[k] > 1 ? a[k] + ' ' + PL[k] : AN[k]);
    return out;
  };
  const wrap = (txt, x, y, w) => {
    const words = txt.split(' '); let line = '', yy = y;
    for (const wd of words) { const t = line ? line + ' ' + wd : wd; if (g.measureText(t).width > w && line) { g.fillText(line, x, yy); line = wd; yy += 14; } else line = t; }
    if (line) g.fillText(line, x, yy);
  };
  const grid = (list, y0) => {
    list.forEach((d, i) => {
      const c = i % COLS, r = (i / COLS) | 0, x = 10 + c * (TS + GAP), y = y0 + r * (TS + LH);
      g.save(); g.shadowColor = 'rgba(0,0,0,.55)'; g.shadowBlur = 10; g.shadowOffsetY = 4;
      g.drawImage(VA.tile(d, 0, TS * dpr), x, y, TS, TS); g.restore();
      g.fillStyle = 'rgba(20,14,8,.78)'; g.beginPath(); g.roundRect(x + 4, y + 4, d.start ? 64 : 34, 20, 7); g.fill();
      g.fillStyle = '#ffe9b0'; g.font = '700 13px system-ui'; g.fillText(d.start ? 'partenza' : 'x' + d.n, x + 9, y + 18);
      g.fillStyle = '#f4ead8'; g.font = '11.5px system-ui'; g.globalAlpha = 0.82;
      wrap(desc(d).join(', '), x + 2, y + TS + 14, TS - 2); g.globalAlpha = 1;
    });
    return y0 + rows(list) * (TS + LH);
  };
  g.fillStyle = '#f4ead8'; g.font = '600 20px system-ui'; g.fillText('La Valle dei Clan', 12, 30);
  g.font = '13px system-ui'; g.globalAlpha = 0.75; g.fillText('tutte le tessere: 79 normali + 12 speciali', 12, 52); g.globalAlpha = 1;
  let y = grid(normal, 70);
  g.fillStyle = '#f4ead8'; g.font = '600 16px system-ui'; g.fillText('Tessere speciali (si pescano chiudendo', 12, y + 22); g.fillText('un bosco con l\'ambra)', 12, y + 42);
  y = grid(special, y + 60);
  g.font = '12.5px system-ui'; g.globalAlpha = 0.85;
  Object.values(SPN).forEach((t, i) => g.fillText(t, 12, y + 20 + i * 20));
  g.globalAlpha = 1;
  window.__img = cv.toDataURL('image/jpeg', 0.88);
})();
</script>
</body>
</html>
