<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>La Valle dei Clan - prova di stile</title>
<style>
  body { margin: 0; background: #241c15; color: #f4ead8; font: 15px system-ui, sans-serif; }
  canvas { display: block; margin: 0 auto; }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<script src="../giochi/valle.js"></script>
<script>
(() => {
  const C = VA.COLORS;
  // ---- un pezzetto di valle 4 x 3 (bordi N E S O) ----
  const T = {
    a: { id: 'a', e: 'bppp', fz: [[0]], ob: [{ k: 'cav', x: 62, y: 150 }, { k: 'cav', x: 140, y: 168, f: -1 }] },
    b: { id: 'b', e: 'pbpp', fz: [[1]], ob: [{ k: 'bis', x: 70, y: 135 }] },
    c: { id: 'c', e: 'ppbb', fz: [[2, 3]], ob: [{ k: 'ambra', x: 44, y: 150 }, { k: 'orso', x: 140, y: 70 }] },
    d: { id: 'd', e: 'bbpp', fz: [[0, 1]], ob: [{ k: 'cav', x: 64, y: 160 }] },
    e: { id: 'e', e: 'pfpp', rv: [{ e: [1], end: 's' }], ob: [{ k: 'bis', x: 70, y: 170 }] },
    f: { id: 'f', e: 'pfpf', rv: [{ e: [1, 3], p: 2 }], ob: [] },
    g: { id: 'g', e: 'bpff', fz: [[0]], rv: [{ e: [3, 2], p: 1 }], ob: [{ k: 'cav', x: 150, y: 160, f: -1 }] },
    h: { id: 'h', e: 'pppp', ob: [{ k: 'rin', x: 100, y: 105 }, { k: 'cav', x: 52, y: 58 }] },
    i: { id: 'i', e: 'ppbb', fz: [[2, 3]], ob: [{ k: 'orso', x: 132, y: 72, f: -1 }] },
    j: { id: 'j', e: 'pppp', ob: [{ k: 'bis', x: 88, y: 112 }, { k: 'cav', x: 150, y: 62, f: -1 }] },
    k: { id: 'k', e: 'fppp', rv: [{ e: [0], end: 'l' }], lake: { p: 3 }, ob: [] },
    l: { id: 'l', e: 'ppbp', fz: [[2]], ob: [{ k: 'cav', x: 100, y: 84 }] },
    hand: { id: 'hand', e: 'pfbf', fz: [[2]], rv: [{ e: [1, 3], p: 1 }], ob: [{ k: 'bis', x: 100, y: 62 }] },
  };
  const MAP = [['a', 'b', 'c', 'd'], ['e', 'f', 'g', 'h'], ['i', 'j', 'k', 'l']];
  const dpr = 2, W = 412, TS = 80, ox = 6, oy = 46;
  const H = 1190;
  const cv = document.getElementById('cv'); cv.width = W * dpr; cv.height = H * dpr; cv.style.width = W + 'px'; cv.style.height = H + 'px';
  const g = cv.getContext('2d'); g.scale(dpr, dpr);
  // tavolo
  const bg = g.createRadialGradient(W / 2, 300, 50, W / 2, 300, 700); bg.addColorStop(0, '#4a3a2a'); bg.addColorStop(1, '#1e1711');
  g.fillStyle = bg; g.fillRect(0, 0, W, H);
  g.fillStyle = '#f4ead8'; g.font = '600 20px system-ui'; g.fillText('La Valle dei Clan', 14, 28);
  g.font = '13px system-ui'; g.globalAlpha = 0.7; g.fillText('prova di stile', 178, 28); g.globalAlpha = 1;
  const k = TS / VA.S;
  // ombra della mappa
  g.save(); g.shadowColor = 'rgba(0,0,0,.55)'; g.shadowBlur = 18; g.shadowOffsetY = 6; g.fillStyle = '#000';
  g.fillRect(ox, oy, TS * 4, TS * 3); g.restore();
  MAP.forEach((row, r) => row.forEach((id, c) => {
    g.drawImage(VA.tile(T[id], 0, TS * dpr), ox + c * TS, oy + r * TS, TS, TS);
    g.strokeStyle = 'rgba(0,0,0,.12)'; g.lineWidth = 0.6; g.strokeRect(ox + c * TS + 0.3, oy + r * TS + 0.3, TS - 0.6, TS - 0.6);
  }));
  // posti dove la tessera in mano combacia (illuminati)
  const spot = (c, r) => {
    const x = ox + c * TS, y = oy + r * TS;
    g.save(); g.shadowColor = 'rgba(255,214,90,.9)'; g.shadowBlur = 14;
    g.fillStyle = 'rgba(255,226,120,.16)'; g.beginPath(); g.roundRect(x + 4, y + 4, TS - 8, TS - 8, 9); g.fill();
    g.setLineDash([7, 5]); g.strokeStyle = 'rgba(255,222,110,.95)'; g.lineWidth = 2.2; g.stroke(); g.restore();
    g.fillStyle = 'rgba(255,230,140,.9)'; g.font = '700 22px system-ui'; g.textAlign = 'center'; g.fillText('+', x + TS / 2, y + TS / 2 + 8); g.textAlign = 'left';
  };
  spot(4, 1); spot(4, 2); spot(1, 3);
  // omini sulla mappa (in unita' della tessera)
  const at = (c, r, x, y) => [ox + c * TS + x * k, oy + r * TS + y * k];
  g.save();
  let [x, y] = at(1, 1, 100, 112); VA.meeple(g, x, y, C.rosso, 'pesca', 0.62);
  [x, y] = at(2, 0, 70, 120); VA.meeple(g, x, y, C.blu, 'racc', 0.62);
  [x, y] = at(3, 1, 140, 175); VA.meeple(g, x, y, C.giallo, 'cacc', 0.62);
  [x, y] = at(2, 2, 100, 150); VA.hut(g, x, y, C.rosso, 0.62);
  [x, y] = at(3, 0, 150, 52); VA.meeple(g, x, y, C.verde, 'racc', 0.62);
  g.restore();

  // ---- tessera pescata ----
  let Y = oy + TS * 4 + 18;
  g.fillStyle = 'rgba(0,0,0,.35)'; g.beginPath(); g.roundRect(6, Y - 6, W - 12, 128, 14); g.fill();
  g.save(); g.shadowColor = 'rgba(0,0,0,.6)'; g.shadowBlur = 12; g.shadowOffsetY = 4;
  g.drawImage(VA.tile(T.hand, 1, 108 * dpr), 18, Y + 4, 108, 108); g.restore();
  g.fillStyle = '#f4ead8'; g.font = '600 16px system-ui'; g.fillText('Tessera pescata', 142, Y + 30);
  g.font = '14px system-ui'; g.globalAlpha = 0.8;
  g.fillText('Tocca un posto illuminato:', 142, Y + 56); g.fillText('la tessera ci va gia\' girata.', 142, Y + 76);
  g.fillText('Altro tocco = altro verso valido.', 142, Y + 96); g.globalAlpha = 1;

  // ---- tessere grandi ----
  Y += 146;
  g.fillStyle = '#f4ead8'; g.font = '600 15px system-ui'; g.fillText('Tessere da vicino', 14, Y); Y += 10;
  const big = 126;
  [['e', 0], ['g', 0], ['k', 0]].forEach(([id, r], i) => {
    const x0 = 10 + i * (big + 8);
    g.save(); g.shadowColor = 'rgba(0,0,0,.55)'; g.shadowBlur = 10; g.shadowOffsetY = 4;
    g.drawImage(VA.tile(T[id], r, big * dpr), x0, Y, big, big); g.restore();
  });
  g.font = '12px system-ui'; g.globalAlpha = 0.75;
  ['sorgente', 'bosco + fiume', 'lago con pesci'].forEach((s, i) => g.fillText(s, 12 + i * (big + 8), Y + big + 16));
  g.globalAlpha = 1;

  // ---- animali ----
  Y += big + 42;
  g.fillStyle = '#f4ead8'; g.font = '600 15px system-ui'; g.fillText('Animali e ambra', 14, Y); Y += 8;
  const box = (x0, y0, w, h) => { g.fillStyle = '#8fc15a'; g.beginPath(); g.roundRect(x0, y0, w, h, 12); g.fill(); };
  const names = [['cav', 'cavallo'], ['bis', 'bisonte'], ['rin', 'rinoceronte'], ['orso', 'orso']];
  names.forEach(([kk, n], i) => {
    const bw = 94, x0 = 10 + i * (bw + 6);
    box(x0, Y, bw, 86); VA.animal(g, kk, x0 + bw / 2 - 6, Y + 70, 1.45);
    g.fillStyle = '#f4ead8'; g.font = '12px system-ui'; g.globalAlpha = 0.8; g.fillText(n, x0 + 4, Y + 102); g.globalAlpha = 1;
  });
  Y += 116;
  g.fillStyle = '#3f97d3'; g.beginPath(); g.roundRect(10, Y, 94, 70, 12); g.fill();
  VA.fish(g, 40, Y + 26, 0.3, 1.6); VA.fish(g, 72, Y + 46, Math.PI - 0.2, 1.6);
  g.fillStyle = '#3f6b2f'; g.beginPath(); g.roundRect(110, Y, 94, 70, 12); g.fill();
  VA.amber(g, 157, Y + 36, 1.8);
  g.fillStyle = '#8fc15a'; g.beginPath(); g.roundRect(210, Y, 94, 70, 12); g.fill();
  g.fillStyle = '#3f97d3'; g.beginPath(); g.roundRect(210, Y + 50, 94, 20, [0, 0, 12, 12]); g.fill();
  VA.hut(g, 257, Y + 60, C.blu, 1.15);
  g.fillStyle = '#f4ead8'; g.font = '12px system-ui'; g.globalAlpha = 0.8;
  g.fillText('pesci', 14, Y + 86); g.fillText('ambra', 114, Y + 86); g.fillText('palafitta', 214, Y + 86); g.globalAlpha = 1;

  // ---- omini ----
  Y += 116;
  g.fillStyle = '#f4ead8'; g.font = '600 15px system-ui'; g.fillText('Omini del clan', 14, Y); Y += 8;
  box(10, Y, W - 20, 96);
  const roles = [['pesca', C.rosso], ['racc', C.blu], ['pesca', C.giallo], ['racc', C.verde], ['pesca', C.viola]];
  roles.forEach(([r, c], i) => VA.meeple(g, 34 + i * 48, Y + 78, c, r, 1.35));
  VA.meeple(g, 330, Y + 74, C.giallo, 'cacc', 1.2);
  g.fillStyle = '#f4ead8'; g.font = '12px system-ui'; g.globalAlpha = 0.8;
  g.fillText('pescatore, raccoglitrice, ...', 14, Y + 112); g.fillText('cacciatore sdraiato', 290, Y + 112); g.globalAlpha = 1;
  window.__img = cv.toDataURL('image/jpeg', 0.9);
})();
</script>
</body>
</html>
