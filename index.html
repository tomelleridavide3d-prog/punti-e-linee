<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Linee e quadrettini birichini</title>
<meta name="theme-color" content="#f5f4f0">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 26 26'%3E%3Crect width='26' height='26' rx='6' fill='%23fff'/%3E%3Cpath d='M5 5H21V21' stroke='%232f6fe4' stroke-width='3.5' fill='none' stroke-linecap='round'/%3E%3Cpath d='M5 5V21H21' stroke='%23e2553a' stroke-width='3.5' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#f5f4f0; --panel:#ffffff; --ink:#1d2127; --muted:#6b7280; --line:#e4e2dc; --dot:#2a2e35; --ghost:#9aa3af;
  --p0:#2f6fe4; --p1:#e2553a; --p2:#1f9d6b; --p3:#c58610;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 6px 20px rgba(0,0,0,.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14161a; --panel:#1d2026; --ink:#e8eaed; --muted:#9aa1ac; --line:#2c3038; --dot:#d5d9df; --ghost:#5d6573;
    --p0:#5b8ff0; --p1:#f07a62; --p2:#3cc28e; --p3:#e3a93a; --shadow:0 1px 2px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --bg:#14161a; --panel:#1d2026; --ink:#e8eaed; --muted:#9aa1ac; --line:#2c3038; --dot:#d5d9df; --ghost:#5d6573;
  --p0:#5b8ff0; --p1:#f07a62; --p2:#3cc28e; --p3:#e3a93a; --shadow:0 1px 2px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
.app{max-width:860px;margin:0 auto;padding:16px;display:flex;flex-direction:column;min-height:100vh;gap:14px}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
h1{font-size:20px;margin:0;font-weight:700;letter-spacing:-.01em;display:flex;align-items:center;gap:10px}
.logo{width:26px;height:26px;flex:none}
h1 small{display:block;font-size:12px;font-weight:500;color:var(--muted);letter-spacing:0;margin-top:1px}
.tools{display:flex;gap:6px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:10px;padding:8px 12px;font:inherit;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.btn:hover:not(:disabled){border-color:var(--ghost)}
.btn:disabled{opacity:.4;cursor:default}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.icon{padding:8px 10px}
.btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.scores{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.card{background:var(--panel);border:2px solid transparent;border-radius:14px;padding:10px 16px;min-width:140px;box-shadow:var(--shadow);display:flex;align-items:center;gap:10px;transition:border-color .2s}
.card.active{border-color:var(--pc)}
.card .sw{width:12px;height:12px;border-radius:50%;background:var(--pc)}
.card .nm{font-size:15px;font-weight:600}
.card .sub{font-size:12px;color:var(--muted)}
.card .score{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;margin-left:auto;padding-left:12px}
.status{text-align:center;color:var(--muted);min-height:22px;font-size:15px}
.status b{color:var(--ink)}
.board-wrap{flex:1;display:flex;align-items:flex-start;justify-content:center}
#board{width:min(100%,70vh);max-width:620px;height:auto;touch-action:manipulation;background:var(--panel);border-radius:20px;box-shadow:var(--shadow);user-select:none}
.empty{color:var(--muted);text-align:center;padding:60px 0}
.dot{fill:var(--dot)}
.edge-on{stroke-width:6;stroke-linecap:round}
.halo{stroke-width:16;stroke-linecap:round;stroke-opacity:.18}
.ghost{stroke:var(--cur);stroke-width:6;stroke-linecap:round;opacity:0;transition:opacity .1s}
#board:not(.locked) .edge-free:hover .ghost{opacity:.45}
.hit{stroke:transparent;stroke-width:26;stroke-linecap:round;cursor:pointer}
#board.locked .hit{cursor:default}
.c0{stroke:var(--p0)} .c1{stroke:var(--p1)} .c2{stroke:var(--p2)} .c3{stroke:var(--p3)}
.box rect{fill-opacity:.15;stroke:none}
.box text{font-weight:700;font-size:22px;text-anchor:middle;dominant-baseline:central;stroke:none}
.box.c0 rect,.box.c0 text{fill:var(--p0)} .box.c1 rect,.box.c1 text{fill:var(--p1)}
.box.c2 rect,.box.c2 text{fill:var(--p2)} .box.c3 rect,.box.c3 text{fill:var(--p3)}
.box.new{animation:pop .3s ease-out;transform-box:fill-box;transform-origin:center}
.edge-on.last{animation:fade .25s ease-out}
@keyframes pop{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes fade{from{opacity:.15}to{opacity:1}}
dialog{border:none;border-radius:18px;padding:0;background:var(--panel);color:var(--ink);width:min(560px,calc(100vw - 32px));max-height:calc(100vh - 32px);box-shadow:0 20px 60px rgba(0,0,0,.28)}
dialog::backdrop{background:rgba(12,14,18,.5)}
.dlg{padding:20px 22px}
.dlg h2{margin:0 0 4px;font-size:20px}
.dlg .lead{color:var(--muted);margin:0 0 6px;font-size:14px}
.row{margin:16px 0}
.lbl{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:6px;font-weight:600}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg label{flex:1 1 auto;position:relative}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg span{display:block;text-align:center;padding:8px 10px;border:1px solid var(--line);border-radius:10px;cursor:pointer;font-size:14px;white-space:nowrap}
.seg input:checked+span{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.seg input:focus-visible+span{outline:2px solid var(--p0);outline-offset:2px}
.hint{font-size:13px;color:var(--muted);margin-top:8px;min-height:18px}
.names{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.names input{font:inherit;font-size:14px;padding:7px 10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);min-width:0}
.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}
.big{font-size:40px;font-weight:700;font-variant-numeric:tabular-nums;margin:6px 0}
.list{margin:12px 0 0;padding:0;list-style:none}
.list li{padding:8px 0;border-top:1px solid var(--line);font-size:14px;display:flex;justify-content:space-between;gap:10px}
.list li span:last-child{font-weight:600;white-space:nowrap}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--p0);border-radius:4px}
.metric{padding:10px 0;border-top:1px solid var(--line)}
.metric .top{display:flex;justify-content:space-between;font-size:14px}
.metric .top span:last-child{color:var(--muted)}
.metric .d{font-size:12px;color:var(--muted);margin-top:2px}
table{width:100%;border-collapse:collapse;font-size:14px;margin-top:6px}
th,td{text-align:right;padding:6px 4px;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
th:first-child,td:first-child{text-align:left}
th{color:var(--muted);font-weight:600;font-size:12px}
.insight{font-size:14px;line-height:1.5;background:var(--bg);border-radius:10px;padding:10px 12px;margin-top:8px}
.spark{width:100%;height:60px;margin-top:6px}
.chip{display:inline-block;font-size:12px;padding:2px 8px;border-radius:999px;background:var(--bg);border:1px solid var(--line);color:var(--muted);margin-left:6px}
.field{font:inherit;font-size:15px;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);width:100%}
.linkbox{display:flex;gap:6px;margin-top:12px}
.linkbox input{flex:1;min-width:0}
.wait{display:flex;align-items:center;gap:10px;margin-top:16px;font-size:14px;color:var(--muted)}
.wait::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--p0);animation:pulse 1.2s ease-in-out infinite}
.wait.ok::before{background:var(--p2);animation:none}
.wait.bad::before{background:var(--p1)}
@keyframes pulse{50%{opacity:.25}}
.net{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:middle;background:var(--p2)}
.net.off{background:var(--p1)}
.pl{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:15px}
.pl:first-child{border-top:none}
.pl .dot2{width:9px;height:9px;border-radius:50%;background:var(--p2);flex:none}
.pl .dot2.busy{background:var(--p3)}
.pl .nm2{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl .st2{font-size:13px;color:var(--muted)}
.pl .btn{padding:5px 12px;font-size:14px}
.liveitem{font-size:14px;color:var(--muted);padding:4px 0}
.liveitem b{color:var(--ink)}
.rk td:first-child{width:28px;color:var(--muted)}
.rk td:nth-child(2){text-align:left}
.rk tr.me td{font-weight:700;color:var(--p0)}
.you{font-size:13px;color:var(--muted);margin:2px 0 0}
.you button{border:none;background:none;color:var(--p0);font:inherit;font-size:13px;padding:0;cursor:pointer;text-decoration:underline}
@media (max-width:520px){ .app{padding:12px} .btn .t{display:none} .btn.keep .t{display:inline} .card{min-width:0;flex:1;padding:8px 12px} .card .score{font-size:24px} h1{font-size:18px} }
#home{position:fixed;inset:0;z-index:5;background:var(--bg);overflow:auto;padding:16px}
#home .hw{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
#home h1{font-size:22px;margin-top:8px}
#home .you{color:var(--muted);font-size:14px;margin:0}
#home .you button{border:0;background:none;color:inherit;text-decoration:underline;font:inherit;cursor:pointer;padding:0}
.gcard{display:flex;align-items:center;gap:14px;width:100%;text-align:left;font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:var(--shadow);cursor:pointer}
.gcard:hover{border-color:var(--ghost)}
.gcard .gi{width:64px;height:64px;flex:none;border-radius:14px;background:var(--bg);display:flex;align-items:center;justify-content:center}
.gcard .gi svg{width:48px;height:48px}
.gcard .gt{font-size:17px;font-weight:700}
.gcard .gs{font-size:13px;color:var(--muted);margin-top:2px}
.gcard .gn{font-size:13px;margin-top:6px;display:flex;align-items:center;gap:6px}
.gcard .gn i{width:8px;height:8px;border-radius:50%;background:var(--ghost);display:inline-block}
.gcard .gn.on i{background:var(--p2)}
.gcard.soon{opacity:.75}
.soonTag{font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted);margin-left:8px;font-weight:600;vertical-align:2px}
#ciack{position:fixed;inset:0;z-index:6;background:var(--bg);touch-action:none;user-select:none;-webkit-user-select:none}
#ciack canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#ciack .ctop{position:absolute;left:12px;top:12px;right:12px;display:flex;align-items:center;gap:10px;pointer-events:none}
#ciack .ctop .btn{pointer-events:auto}
#ciack .ctop b{font-size:17px}
#ciack .chint{position:absolute;left:0;right:0;bottom:18px;text-align:center;color:var(--muted);font-size:14px;pointer-events:none}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>
      <svg class="logo" viewBox="0 0 26 26"><g fill="currentColor"><circle cx="4" cy="4" r="2.5"/><circle cx="22" cy="4" r="2.5"/><circle cx="4" cy="22" r="2.5"/><circle cx="22" cy="22" r="2.5"/></g><path d="M4 4H22V22" stroke="var(--p0)" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M4 4V22H22" stroke="var(--p1)" stroke-width="3" fill="none" stroke-linecap="round"/></svg>
      <span>Linee e quadrettini birichini<small>di Tomelleri Davide per RH group</small></span>
    </h1>
    <div class="tools">

      <button class="btn keep" id="bQuit" title="Abbandona la partita" hidden><svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg><span class="t">Abbandona</span></button>
      <button class="btn" id="bNew" title="Nuova partita"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span class="t">Nuova</span></button>
      <button class="btn" id="bStats" title="Statistiche"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg><span class="t">Statistiche</span></button>
      <button class="btn icon" id="bSound" title="Suoni"></button>
      <button class="btn icon" id="bTheme" title="Tema chiaro/scuro"></button>
    </div>

  <div class="scores" id="scores"></div>
  <div class="status" id="status"></div>
  <div class="board-wrap"><svg id="board" viewBox="0 0 100 100"></svg></div>
</div>

<div id="home" hidden><div class="hw">
  <h1><span>Sala giochi<small>di Tomelleri Davide per RH group</small></span></h1>
  <p class="you" id="homeYou"></p>
  <button class="gcard" id="gDots"><span class="gi"><svg viewBox="0 0 26 26"><g fill="currentColor"><circle cx="4" cy="4" r="2.2"/><circle cx="13" cy="4" r="2.2"/><circle cx="22" cy="4" r="2.2"/><circle cx="4" cy="13" r="2.2"/><circle cx="13" cy="13" r="2.2"/><circle cx="22" cy="13" r="2.2"/></g><path d="M4 4H13V13H4" stroke="var(--p0)" stroke-width="2.4" fill="none" stroke-linejoin="round"/><path d="M13 13H22" stroke="var(--p1)" stroke-width="2.4"/></svg></span>
    <span><div class="gt">Linee e quadrettini birichini</div><div class="gs">Unisci i punti e conquista i quadrati. Sfida un amico a distanza.</div><div class="gn" id="nDots"></div></span></button>
  <button class="gcard soon" id="gAmong"><span class="gi"><svg viewBox="0 0 26 26"><path d="M13 3 23 8.5v9L13 23 3 17.5v-9z" fill="var(--p1)" opacity=".85"/><path d="M3 8.5 13 14l10-5.5" fill="none" stroke="var(--panel)" stroke-width="1.4"/><path d="M13 14v9" stroke="var(--panel)" stroke-width="1.4"/></svg></span>
    <span><div class="gt">Ciack US<span class="soonTag">in costruzione</span></div><div class="gs">Sul set del film: stanze isometriche, compiti da svolgere e un impostore da scovare.</div><div class="gn" id="nAmong"></div></span></button>
</div></div>
<div id="ciack" hidden>
  <canvas id="cqCanvas"></canvas>

</div>
<dialog id="dSetup"><form method="dialog" class="dlg" id="fSetup"></form></dialog>
<dialog id="dEnd"><div class="dlg" id="endBody"></div></dialog>

<dialog id="dLobby"><div class="dlg" id="lobbyBody"></div></dialog>

<script>
// ==ENGINE==
// Griglia R x C quadrati. Lati orizzontali: id = r*C + c (r 0..R). Verticali: id = H + r*(C+1) + c (c 0..C).
function makeTopo(R, C) {
  const H = (R + 1) * C, E = H + R * (C + 1), B = R * C;
  const eb = new Int16Array(E * 2).fill(-1), be = new Int16Array(B * 4), geo = [];
  for (let r = 0; r <= R; r++) for (let c = 0; c < C; c++) {
    const e = r * C + c;
    if (r > 0) eb[e * 2] = (r - 1) * C + c;
    if (r < R) eb[e * 2 + 1] = r * C + c;
    geo[e] = [c, r, c + 1, r];
  }
  for (let r = 0; r < R; r++) for (let c = 0; c <= C; c++) {
    const e = H + r * (C + 1) + c;
    if (c > 0) eb[e * 2] = r * C + c - 1;
    if (c < C) eb[e * 2 + 1] = r * C + c;
    geo[e] = [c, r, c, r + 1];
  }
  for (let b = 0; b < B; b++) {
    const r = Math.floor(b / C), c = b % C;
    be[b * 4] = r * C + c; be[b * 4 + 1] = (r + 1) * C + c;
    be[b * 4 + 2] = H + r * (C + 1) + c; be[b * 4 + 3] = H + r * (C + 1) + c + 1;
  }
  return { R, C, H, E, B, eb, be, geo };
}
const newState = T => ({ T, ed: new Uint8Array(T.E), cnt: new Uint8Array(T.B), free: T.E });
const cloneState = st => ({ T: st.T, ed: st.ed.slice(), cnt: st.cnt.slice(), free: st.free });
const ABORT = { abort: true };
const pick = a => a[Math.floor(Math.random() * a.length)];

function play(st, e) {
  st.ed[e] = 1; st.free--;
  let k = 0;
  for (let i = 0; i < 2; i++) { const b = st.T.eb[e * 2 + i]; if (b >= 0 && ++st.cnt[b] === 4) k++; }
  return k;
}
function unplay(st, e) {
  st.ed[e] = 0; st.free++;
  for (let i = 0; i < 2; i++) { const b = st.T.eb[e * 2 + i]; if (b >= 0) st.cnt[b]--; }
}
function otherBox(T, e, b) { return T.eb[e * 2] === b ? T.eb[e * 2 + 1] : T.eb[e * 2]; }
function isSafe(st, e) {
  for (let i = 0; i < 2; i++) { const b = st.T.eb[e * 2 + i]; if (b >= 0 && st.cnt[b] >= 2) return false; }
  return true;
}
function freeEdges(st) { const r = []; for (let e = 0; e < st.T.E; e++) if (!st.ed[e]) r.push(e); return r; }
function safeEdges(st) { const r = []; for (let e = 0; e < st.T.E; e++) if (!st.ed[e] && isSafe(st, e)) r.push(e); return r; }
function freeEdgeOf(st, b, skip = -1) {
  for (let k = 0; k < 4; k++) { const e = st.T.be[b * 4 + k]; if (!st.ed[e] && e !== skip) return e; }
  return -1;
}
function firstCap(st) {
  for (let b = 0; b < st.T.B; b++) if (st.cnt[b] === 3) return freeEdgeOf(st, b);
  return -1;
}
function capEdges(st) {
  const s = new Set();
  for (let b = 0; b < st.T.B; b++) if (st.cnt[b] === 3) s.add(freeEdgeOf(st, b));
  return [...s];
}
function keyOf(st) {
  let s = '';
  for (let i = 0; i < st.T.E; i += 16) {
    let w = 0;
    for (let j = 0; j < 16 && i + j < st.T.E; j++) if (st.ed[i + j]) w |= 1 << j;
    s += String.fromCharCode(w);
  }
  return s;
}
// Mosse "doppio incrocio": invece di prendere, si lasciano 2 quadrati (catena) o 4 (anello) all'avversario.
function ddCandidates(st) {
  const T = st.T, out = new Set();
  for (let a = 0; a < T.B; a++) {
    if (st.cnt[a] !== 3) continue;
    const e = freeEdgeOf(st, a), b = otherBox(T, e, a);
    if (b < 0 || st.cnt[b] !== 2) continue;
    const f = freeEdgeOf(st, b, e);
    if (f < 0) continue;
    const o = otherBox(T, f, b);
    if (o >= 0 && st.cnt[o] >= 3) continue;
    out.add(f);
  }
  return [...out];
}
// Fase finale senza mosse sicure e senza catture: scompone in catene e anelli.
function analyze(st) {
  const T = st.T, seen = new Uint8Array(T.B), comps = [];
  for (let b = 0; b < T.B; b++) if (st.cnt[b] < 2) return { simple: false, comps };
  for (let b = 0; b < T.B; b++) {
    if (st.cnt[b] !== 2 || seen[b]) continue;
    const stack = [b], edges = new Set(); seen[b] = 1;
    let n = 0, ground = 0;
    while (stack.length) {
      const x = stack.pop(); n++;
      for (let k = 0; k < 4; k++) {
        const e = T.be[x * 4 + k];
        if (st.ed[e]) continue;
        if (edges.has(e)) continue;
        edges.add(e);
        const o = otherBox(T, e, x);
        if (o < 0) ground++;
        else if (!seen[o]) { seen[o] = 1; stack.push(o); }
      }
    }
    comps.push({ len: n, loop: ground === 0, edges: [...edges] });
  }
  return { simple: true, comps };
}
function openEdge(T, c) {

function recordOnline() {
  const gid = net && net.cfg && net.cfg.gid, O = store.online;
  if (!gid || O.seen.includes(gid)) return;
  O.seen.push(gid); if (O.seen.length > 300) O.seen.shift();
  const me = game.players.findIndex(p => p.kind === 'human'), op = 1 - me;
  const a = game.scores[me], b = game.scores[op], opp = game.players[op].name, res = game.forfeit != null ? (game.forfeit === me ? 'l' : 'w') : a > b ? 'w' : a < b ? 'l' : 'd';
  const v = O.vs[opp] || (O.vs[opp] = { w: 0, l: 0, d: 0, pf: 0, pa: 0 });
  v[res]++; v.pf += a; v.pa += b;
  O.games.unshift({ t: Date.now(), opp, a, b, res, size: game.T.R });
  if (O.games.length > 50) O.games.length = 50;
  saveStore();
  const c = net.cfg, host = net.role === 'host', rm = host ? c.rh : c.rg, ro = host ? c.rg : c.rh;
  if (typeof rm === 'number' && typeof ro === 'number') {
    const exp = 1 / (1 + Math.pow(10, (ro - rm) / 400)), sc = res === 'w' ? 1 : res === 'd' ? 0.5 : 0;
    const delta = Math.round(32 * (sc - exp));
    game.elo = { delta, rating: Math.max(0, rm + delta) };
  }
  hubRecord({ gid, opp, a, b, res, size: game.T.R, delta: game.elo ? game.elo.delta : 0 });
}

// Il telefono che crea la partita ("host") tiene la versione ufficiale; l'altro ("guest") si riallinea su di lui.
const SITE = 'https://tomelleridavide3d-prog.github.io/punti-e-linee/';
const ONLINE_KEY = 'puntiLinee.online', PEER_PREFIX = 'pel26-';
let net = null;
const netReady = () => !!(net && net.conn && net.conn.open && net.synced);
function randCode(n = 6) { const a = 'abcdefghjkmnpqrstuvwxyz23456789'; let s = ''; for (let i = 0; i < n; i++) s += a[Math.floor(Math.random() * a.length)]; return s; }
function loadPeerJS() {
  if (window.Peer) return Promise.resolve();
  return new Promise((ok, ko) => {
    const s = document.createElement('script');
    s.src = 'peerjs.min.js'; s.onload = ok; s.onerror = () => ko(new Error('peerjs'));
    document.head.appendChild(s);
  });
}
function saveOnline() {
  if (!net) return;
  const moves = game && game.online ? game.history.map(h => h.e) : [];
  try { localStorage.setItem(ONLINE_KEY, JSON.stringify({ role: net.role, code: net.code, token: net.token, name: net.name, cfg: net.cfg, guestToken: net.guestToken, moves })); } catch {}
}
function loadOnline() { try { return JSON.parse(localStorage.getItem(ONLINE_KEY)); } catch { return null; } }
function inviteLink() { return (location.protocol === 'file:' ? SITE : location.origin + location.pathname) + '#p=' + net.code; }
function sendNet(msg) { if (net && net.conn && net.conn.open) try { const p = net.conn.send(msg); if (p && p.catch) p.catch(() => {}); } catch {} }
function setConn() { render(); }
function leaveOnline() {
  if (!net) return;
  sendNet({ t: 'bye' });
  hubClearInvite(); hubLiveClear();
  const n = net; net = null;
  clearTimeout(n.retryT); clearTimeout(n.fallbackT);
  relayClose(n);
  setTimeout(() => { try { n.peer && n.peer.destroy(); } catch {} }, 300);
  try { localStorage.removeItem(ONLINE_KEY); } catch {}
  history.replaceState(null, '', location.pathname + location.search);
  if (game && game.online) game = null;
  if ($('#dLobby').open) $('#dLobby').close();
  hubPresence();
}
function startOnlineGame(moves) {
  const c = net.cfg, T = makeTopo(c.size, c.size);
  const hostP = { name: c.host, color: 0 }, guestP = { name: c.guest || 'Amico', color: 1 };
  const me = net.role === 'host' ? hostP : guestP;
  for (const p of [hostP, guestP]) p.kind = p === me ? 'human' : 'remote';
  createGame(T, c.hostFirst ? [hostP, guestP] : [guestP, hostP], c.rule, { online: true });
  for (const e of moves) makeMove(e, true, true);
  if (!game.over && $('#dEnd').open) $('#dEnd').close();
  saveOnline(); render();
  hubPresence(); hubLive();
}
function sendSync() { if (game && game.online) sendNet({ t: 'sync', cfg: net.cfg, moves: game.history.map(h => h.e) }); }
function recvMove(d) {
  if (!game || !game.online) return;
  if (d.n < game.history.length) return;
  if (d.n > game.history.length || game.players[game.turn].kind !== 'remote' || game.st.ed[d.e]) {
    if (net.role === 'host') sendSync(); else sendNet({ t: 'need' });
    return;
  }
  makeMove(d.e, true);
}
function rematch() {
  net.cfg.hostFirst = Math.random() < 0.5;
  net.cfg.gid = randCode(8);
  net.cfg.rh = myRating(); if (Number.isFinite(net.guestRating)) net.cfg.rg = net.guestRating;
  startOnlineGame([]); sendSync();
  if ($('#dEnd').open) $('#dEnd').close();
}
function onVisible() {
  if (!net || document.visibilityState !== 'visible') return;
  if (net.role === 'host') { if (!net.peer || net.peer.destroyed) createHostPeer(); else if (net.peer.disconnected) net.peer.reconnect(); }
  else if (!(net.conn && net.conn.open) && window.Peer) connectToHost();
}
document.addEventListener('visibilitychange', onVisible);
window.addEventListener('online', onVisible);

// -- host --
async function hostOnline(resume) {
  try { await loadPeerJS(); } catch { alert('Non riesco a caricare la parte online del gioco. Controlla la connessione a Internet.'); return; }
  net = resume || { role: 'host', code: randCode(), name: (store.settings.myName || '').trim() || 'Giocatore 1', cfg: null, guestToken: null };
  net.role = 'host'; net.synced = false;
  if (!resume && pendingChallenge) { net.challenge = pendingChallenge; pendingChallenge = null; }
  history.replaceState(null, '', '#p=' + net.code);
  saveOnline();
  createHostPeer(); hostRelay();
  if (net.cfg) startOnlineGame(resume.moves || []); else showLobby();
}
function createHostPeer() {
  if (!net) return;
  if (net.peer && !net.peer.destroyed) net.peer.destroy();
  const peer = new Peer(PEER_PREFIX + net.code);
  net.peer = peer; net.ready = false;
  const mine = () => net && net.peer === peer;
  peer.on('open', () => { if (mine()) { net.ready = true; updateLobby(); if (net.challenge && !net.cfg) hubSendInvite(); } });
  peer.on('connection', conn => {
    conn.on('data', d => { if (mine()) hostRecv(conn, d); });
    conn.on('close', () => { if (mine() && net.conn === conn) { net.conn = null; net.synced = false; setConn(); } });
  });
  peer.on('disconnected', () => setTimeout(() => { if (mine() && !peer.destroyed && peer.disconnected) peer.reconnect(); }, 1500));
  peer.on('error', err => {
    if (!mine()) return;
    if (err.type === 'unavailable-id') { net.ready = false; updateLobby(); setTimeout(() => { if (mine()) createHostPeer(); }, 4000); }
    else if (['network', 'server-error', 'socket-error', 'socket-closed'].includes(err.type))
      setTimeout(() => { if (!mine()) return; if (peer.destroyed) createHostPeer(); else if (peer.disconnected) peer.reconnect(); }, 3000);
  });
}
function hostRecv(conn, d) {
  if (d.t === 'hello') {
    if (net.guestToken && d.token !== net.guestToken) { conn.send({ t: 'full' }); setTimeout(() => conn.close(), 500); return; }
    if (net.conn && net.conn !== conn) try { net.conn.close(); } catch {}
    net.conn = conn; net.guestToken = d.token;
    const guestName = (d.name || '').trim() || 'Amico';
    if (!net.cfg) {
      const S = store.settings, hostFirst = Math.random() < 0.5;
      net.cfg = { size: +S.size, rule: S.rule, host: net.name, guest: guestName, hostFirst, gid: randCode(8), rh: myRating(), rg: Number.isFinite(d.rating) ? d.rating : 1000 };
      hubClearInvite();
      startOnlineGame([]);
      if ($('#dLobby').open) $('#dLobby').close();
      beep(660, 0.1, 0.05);
    } else if (net.cfg.guest !== guestName) {
      net.cfg.guest = guestName;
      startOnlineGame(game.history.map(h => h.e));
    }
    net.synced = true; sendSync(); saveOnline(); setConn();
    return;
  }
  if (conn !== net.conn) return;
  if (d.t === 'move') recvMove(d);
  else if (d.t === 'need') sendSync();
  else if (d.t === 'rating') { if (Number.isFinite(d.r)) net.guestRating = d.r; }
  else if (d.t === 'rematch' && game && game.over) rematch();
  else if (d.t === 'forfeit') recvForfeit();
  else if (d.t === 'bye') { net.friendLeft = true; render(); if (!(game && game.forfeit != null)) alert('Il tuo amico è uscito dalla partita.'); }
}
function showLobby() {
  const ch = net.challenge;
  $('#lobbyBody').innerHTML = `<h2>${ch ? 'Sfida a ' + esc(ch.name) : 'Invita il tuo amico'}</h2>
    <p class="lead">${ch ? esc(ch.name) + ' riceve subito la sfida sul suo schermo: appena accetta la partita inizia. Se non la vede, puoi mandargli anche questo link.' : 'Manda questo link al tuo amico. La partita inizia appena lo apre dal suo telefono.'}</p>
    <div class="linkbox"><input class="field" id="lkInput" readonly value="${esc(inviteLink())}"><button class="btn" id="lkCopy">Copia</button></div>
    <div class="wait" id="lkWait"></div>
    <div class="actions"><button class="btn" id="lkCancel">Annulla</button>${navigator.share ? '<button class="btn primary" id="lkShare">Condividi link</button>' : ''}</div>`;

    $('#lkCopy').textContent = 'Copiato!';

  $('#lkCancel').onclick = () => { leaveOnline(); render(); openSetup(); };
  $('#dLobby').oncancel = ev => ev.preventDefault();

function updateLobby() {
  const w = $('#lkWait'); if (!w || !net) return;
  w.className = 'wait';
  const who = net.challenge ? esc(net.challenge.name) : 'il tuo amico';
  if (net.declined) { w.className = 'wait bad'; w.innerHTML = '<b>' + who + '</b> non ha accettato. Puoi annullare o mandargli il link.'; return; }
  w.textContent = net.ready ? (net.challenge ? 'In attesa che ' + net.challenge.name + ' accetti…' : 'In attesa che il tuo amico apra il link…') : 'Preparazione della partita…';

function joinStatus(text, cls = '') { const w = $('#jWait'); if (w) { w.className = 'wait ' + cls; w.textContent = text; } }
async function joinOnline(code, resume) {
  net = resume || { role: 'guest', code, token: randCode(12), name: (store.settings.myName || '').trim() || 'Amico', cfg: null };
  net.role = 'guest'; net.synced = false;
  saveOnline();
  if (net.cfg) startOnlineGame(resume.moves || []);
  const n = net;
  if (await guestRelay()) {
    // se dall'altra parte c'e' una versione vecchia del sito (solo PeerJS), dopo 8 secondi prova anche il collegamento diretto
    n.fallbackT = setTimeout(() => { if (net === n && !n.synced) guestPeerJS(); }, 8000);
    return;
  }
  guestPeerJS();
}
async function guestPeerJS() {
  const n = net; if (!n || n.peer) return;
  try { await loadPeerJS(); } catch { joinStatus('Non riesco a caricare la parte online. Controlla la connessione a Internet.', 'bad'); return; }
  if (net === n) createGuestPeer();
}
function createGuestPeer() {
  if (!net) return;
  if (net.peer && !net.peer.destroyed) net.peer.destroy();
  const peer = new Peer();
  net.peer = peer;
  const mine = () => net && net.peer === peer;
  peer.on('open', () => { if (mine()) connectToHost(); });
  peer.on('disconnected', () => setTimeout(() => { if (mine() && !peer.destroyed && peer.disconnected) peer.reconnect(); }, 1500));
  peer.on('error', err => {
    if (!mine()) return;
    if (err.type === 'peer-unavailable') joinStatus('Il tuo amico non è raggiungibile in questo momento. Riprovo da solo…', 'bad');
    scheduleRetry();
  });
}
function connectToHost() {
  if (!net || net.role !== 'guest') return;
  const peer = net.peer;
  if (!peer || peer.destroyed) { createGuestPeer(); return; }
  if (peer.disconnected) { peer.reconnect(); scheduleRetry(); return; }
  if (!peer.open) return;
  const conn = peer.connect(PEER_PREFIX + net.code, { reliable: true });
  conn.on('open', () => { if (net && net.peer === peer) { net.conn = conn; conn.send({ t: 'hello', token: net.token, name: net.name, rating: myRating() }); } });
  conn.on('data', d => { if (net && net.conn === conn) guestRecv(d); });
  conn.on('close', () => { if (net && net.conn === conn) { net.conn = null; net.synced = false; setConn(); scheduleRetry(); } });
  conn.on('error', () => scheduleRetry());
  setTimeout(() => { if (net && net.conn !== conn && !conn.open) { try { conn.close(); } catch {} scheduleRetry(); } }, 10000);
}
function scheduleRetry() {
  if (!net || net.role !== 'guest' || net.retryT || net.friendLeft) return;
  net.retryT = setTimeout(() => { if (!net) return; net.retryT = 0; if (!(net.conn && net.conn.open)) connectToHost(); }, 3000);
}
function guestRecv(d) {
  if (d.t === 'sync') {
    net.cfg = d.cfg; net.synced = true;
    startOnlineGame(d.moves);
    if ($('#dLobby').open) $('#dLobby').close();
    if (game.over) showEnd(null);
  } else if (d.t === 'move') recvMove(d);
  else if (d.t === 'forfeit') recvForfeit();
  else if (d.t === 'full') { net.friendLeft = true; joinStatus('Questa partita ha già due giocatori.', 'bad'); }
  else if (d.t === 'bye') { net.friendLeft = true; render(); if (!(game && game.forfeit != null)) alert('Il tuo amico è uscito dalla partita.'); }
}

// ---- canale delle mosse via Firebase ----
// Il collegamento diretto di PeerJS spesso non passa tra telefoni su reti mobili diverse (NAT degli operatori):
// le mosse viaggiano allora nel database, in rooms/<codice>/up (guest -> host, con la chiave del canale k)
// e rooms/<codice>/down/<k> (host -> guest). Chi riceve un messaggio lo cancella.
const relayPush = (F, path, v) => F.push(F.ref(F.db, path), Object.assign(v, { ts: Date.now() }));
async function hostRelay() {
  const n = net; let F;
  try { F = await hubLoad(); } catch { return; }
  if (net !== n || n.relayUnsub) return;
  const base = 'rooms/' + n.code, conns = {};
  n.relayUnsub = F.onChildAdded(F.ref(F.db, base + '/up'), s => {
    const v = s.val(); F.remove(s.ref).catch(() => {});
    if (net !== n || !v || typeof v.k !== 'string' || typeof v.m !== 'string') return;
    let d; try { d = JSON.parse(v.m); } catch { return; }
    const c = conns[v.k] || (conns[v.k] = { open: true, relay: true, send: m => relayPush(F, base + '/down/' + v.k, { m: JSON.stringify(m) }), close() { this.open = false; } });
    if (d.t === 'hello') c.open = true;
    else if (c !== n.conn) { c.send({ t: 'rehello' }).catch(() => {}); return; }   // l'host ha ricaricato la pagina: l'amico si ripresenta
    if (c.open) hostRecv(c, d);
  }, () => { n.relayUnsub = null; });
  F.set(F.ref(F.db, base + '/host'), Date.now()).catch(() => {});   // "sono (di nuovo) qui": l'amico si ripresenta
  if (!n.ready) { n.ready = true; updateLobby(); if (n.challenge && !n.cfg) hubSendInvite(); }
}
async function guestRelay() {
  const n = net; let F;
  try { F = await Promise.race([hubLoad(), new Promise((_, ko) => setTimeout(() => ko(new Error('lento')), 6000))]); } catch { return false; }
  if (net !== n) return true;
  const base = 'rooms/' + n.code, k = randCode(10);
  const c = { open: true, relay: true };
  c.send = m => relayPush(F, base + '/up', { k, m: JSON.stringify(m) });
  c.hello = () => c.send({ t: 'hello', token: n.token, name: n.name, rating: myRating() });
  const unsub = F.onChildAdded(F.ref(F.db, base + '/down/' + k), s => {
    const v = s.val(); F.remove(s.ref).catch(() => {});
    if (!c.open || net !== n || n.conn !== c || !v || typeof v.m !== 'string') return;
    let d; try { d = JSON.parse(v.m); } catch { return; }
    if (d.t === 'rehello') c.hello().catch(() => {}); else guestRecv(d);
  }, () => {});
  let first = true;
  const unsubHost = F.onValue(F.ref(F.db, base + '/host'), () => { if (first) { first = false; return; } if (c.open && net === n && n.conn === c) c.hello().catch(() => {}); }, () => {});
  c.close = () => { c.open = false; try { unsub(); unsubHost(); } catch {} };
  n.conn = c;
  try { await c.hello(); } catch { c.close(); if (n.conn === c) n.conn = null; return false; }   // regole del database non aggiornate
  return true;
}
function relayClose(n) {
  try { n.relayUnsub && n.relayUnsub(); } catch {}
  n.relayUnsub = null;
  if (n.conn && n.conn.relay) try { n.conn.close(); } catch {}
  const F = hub.fb;
  if (F && n.role === 'host') setTimeout(() => F.remove(F.ref(F.db, 'rooms/' + n.code)).catch(() => {}), 5000);   // dopo il saluto finale
}

const nameKey = n => String(n || '').toLowerCase().normalize('NFD').replace(/[^a-z0-9]/g, '').slice(0, 14) || 'x';

// la mappa ferma si disegna una volta sola in un'immagine (si rifa' solo se cambia la misura dello schermo)
function cqBuildBg() {
  const TW = Math.max(48, Math.min(cq.w, cq.h) / 8), TH = TW / 2;
  const ox = CQ_H * TW / 2 + TW, oy = 3.6 * TH * 1.15 + TW;
  const bw = (CQ_W + CQ_H) * TW / 2 + 2 * TW, bh = (CQ_W + CQ_H) * TH / 2 + oy + TW;
  let sc = cq.dpr; if (bw * bh * sc * sc > 11e6) sc = Math.sqrt(11e6 / (bw * bh));   // limite di memoria dei telefoni
  if (sc !== cq.dpr) sc = Math.floor(sc * 8) / 8;
  const c = document.createElement('canvas'); c.width = Math.ceil(bw * sc); c.height = Math.ceil(bh * sc);
  const g = c.getContext('2d'); g.setTransform(sc, 0, 0, sc, ox * sc, oy * sc);
  const T = cqTools(g, TW), cells = [];
  for (let y = 0; y < CQ_H; y++) for (let x = 0; x < CQ_W; x++) { T.floor(x, y); if (cqSolid[y][x]) cells.push([x + y, x, y, cqSolid[y][x]]); }
  T.decals();
  cells.sort((a, b) => a[0] - b[0]).forEach(([, x, y, o]) => T.cell(x, y, o));
  cq.bg = { c, TW, ox, oy, bw, bh };
}
function cqDraw() {
  const c = $('#cqCanvas'), g = c.getContext('2d'), W = cq.w, H = cq.h;
  if (!cq.bg) cqBuildBg();
  const B = cq.bg, TW = B.TW, TH = TW / 2;
  const px = (x, y) => (x - y) * TW / 2, py = (x, y) => (x + y) * TH / 2;
  // posizioni allineate ai pixel dello schermo: l'immagine pronta e il riquadro ridisegnato combaciano senza righe
  const dp = cq.dpr, al = v => Math.round(v * dp) / dp, X = px(cq.x, cq.y), Y = py(cq.x, cq.y);
  const ix = al(W / 2 - X - B.ox), iy = al(H / 2 - Y + TH - B.oy), tx = ix + B.ox, ty = iy + B.oy;
  g.setTransform(dp, 0, 0, dp, 0, 0); g.clearRect(0, 0, W, H);
  g.drawImage(B.c, ix, iy, B.bw, B.bh);
  // intorno all'omino si ridisegna tutto da capo (pavimento, oggetti dietro, omino, oggetti davanti), solo in un piccolo riquadro
  g.save();
  const rx = al(tx + X - 0.8 * TW), ry = al(ty + Y - 2 * TW), rw = al(1.6 * TW), rh = al(2.4 * TW);
  g.beginPath(); g.rect(rx, ry, rw, rh); g.clip(); g.clearRect(rx, ry, rw, rh);
  g.translate(tx, ty);
  const T = cqTools(g, TW), fx = Math.floor(cq.x), fy = Math.floor(cq.y), items = [];
  for (let y = fy - 7; y <= fy + 8; y++) for (let x = fx - 7; x <= fx + 8; x++) {
    T.floor(x, y);
    const o = cqSolid[y] && cqSolid[y][x]; if (o) items.push({ d: x + y + 1, x, y, o });
  }
  T.decals();
  items.push({ d: cq.x + cq.y, me: 1 });
  items.sort((a, b) => a.d - b.d);
  for (const it of items) { if (it.me) cqPlayer(g, X, Y, TW); else T.cell(it.x, it.y, it.o); }
  g.restore();
  // joystick
  if (cq.joy) {
    const j = cq.joy, dx = j.x - j.x0, dy = j.y - j.y0, m = Math.hypot(dx, dy), k = m > 40 ? 40 / m : 1;
    g.strokeStyle = 'rgba(150,160,175,.55)'; g.lineWidth = 2; g.beginPath(); g.arc(j.x0, j.y0, 40, 0, 7); g.stroke();
    g.fillStyle = 'rgba(150,160,175,.55)'; g.beginPath(); g.arc(j.x0 + dx * k, j.y0 + dy * k, 16, 0, 7); g.fill();
  }
}

  g.fillStyle = '#bfe3f2'; g.beginPath(); g.ellipse(4 * f, -28, 8.5, 6, 0, 0, 7); g.fill();
  g.fillStyle = 'rgba(255,255,255,.7)'; g.beginPath(); g.ellipse(6.5 * f, -30, 3, 1.8, 0, 0, 7); g.fill();
  g.fillStyle = '#2a2e35'; g.beginPath(); g.ellipse(0, -39, 19, 5.5, 0, 0, 7); g.fill();
  g.fillStyle = '#3a3f49'; g.beginPath(); g.moveTo(-10, -39); g.quadraticCurveTo(-10, -56, 0, -56); g.quadraticCurveTo(10, -56, 10, -39); g.quadraticCurveTo(0, -35, -10, -39); g.fill();

}

  try {
    const r = await fetch(location.pathname + '?chk=' + Date.now(), { method: 'HEAD', cache: 'no-store' });
    const srv = Date.parse(r.headers.get('last-modified') || ''), mine = Date.parse(document.lastModified);
    if (!srv || !mine || srv <= mine + 1000) return;
    if (sessionStorage.getItem('plUpd') === String(srv)) return;   // gia' ricaricato per questa versione
    sessionStorage.setItem('plUpd', String(srv));
    if (!net) location.replace(location.pathname + '?v=' + srv + location.hash);
  } catch {}
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') checkUpdate(); });

// ---- avvio ----
if (WEB) store.settings.mode = 'online';
checkUpdate();
applyPrefs(); render();
(() => {
  startHub();
  $('#gDots').onclick = openSetup;
  cqInit(); $('#gAmong').onclick = openCiack;
  const code = (location.hash.match(/^#p=([a-z0-9]+)$/) || [])[1];
  const saved = loadOnline();
  if (code) enterDots();
  if (code && saved && saved.code === code && saved.cfg) {
    if (saved.role === 'host') hostOnline(saved); else joinOnline(code, saved);
  } else if (code && saved && saved.code === code && saved.role === 'host') hostOnline(saved);
  else if (code) openJoin(code);
  else if (WEB && !(store.settings.myName || '').trim()) askName(() => { startHub(); showHome(); });
  else if (WEB) showHome();
  else openSetup();
})();
</script>
