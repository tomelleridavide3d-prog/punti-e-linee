<!doctype html>
<html lang="it">
<head>

<style>
:root{
  --bg:#f5f4f0; --panel:#ffffff; --ink:#1d2127; --muted:#6b7280; --line:#e4e2dc; --dot:#2a2e35; --ghost:#9aa3af;
  --p0:#2f6fe4; --p1:#e2553a; --p2:#1f9d6b; --p3:#c58610;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 6px 20px rgba(0,0,0,.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14161a; --panel:#1d2026; --ink:#e8eaed; --muted:#9aa1ac; --line:#2c3038; --dot:#d5d9df; --ghost:#5d6573;
    --p0:#5b8ff0; --p1:#f07a62; --p2:#3cc28e; --p3:#e3a93a; --shadow:0 1px 2px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --bg:#14161a; --panel:#1d2026; --ink:#e8eaed; --muted:#9aa1ac; --line:#2c3038; --dot:#d5d9df; --ghost:#5d6573;
  --p0:#5b8ff0; --p1:#f07a62; --p2:#3cc28e; --p3:#e3a93a; --shadow:0 1px 2px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
.app{max-width:860px;margin:0 auto;padding:16px;display:flex;flex-direction:column;min-height:100vh;gap:14px}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
h1{font-size:20px;margin:0;font-weight:700;letter-spacing:-.01em;display:flex;align-items:center;gap:10px}
.logo{width:26px;height:26px;flex:none}
h1 small{display:block;font-size:12px;font-weight:500;color:var(--muted);letter-spacing:0;margin-top:1px}
.tools{display:flex;gap:6px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:10px;padding:8px 12px;font:inherit;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.btn:hover:not(:disabled){border-color:var(--ghost)}
.btn:disabled{opacity:.4;cursor:default}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.icon{padding:8px 10px}
.btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.scores{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.card{background:var(--panel);border:2px solid transparent;border-radius:14px;padding:10px 16px;min-width:140px;box-shadow:var(--shadow);display:flex;align-items:center;gap:10px;transition:border-color .2s}
.card.active{border-color:var(--pc)}
.card .sw{width:12px;height:12px;border-radius:50%;background:var(--pc)}
.card .nm{font-size:15px;font-weight:600}
.card .sub{font-size:12px;color:var(--muted)}
.card .score{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;margin-left:auto;padding-left:12px}
.status{text-align:center;color:var(--muted);min-height:22px;font-size:15px}
.status b{color:var(--ink)}
.board-wrap{flex:1;display:flex;align-items:flex-start;justify-content:center}
#board{width:min(100%,70vh);max-width:620px;height:auto;touch-action:manipulation;background:var(--panel);border-radius:20px;box-shadow:var(--shadow);user-select:none}
.empty{color:var(--muted);text-align:center;padding:60px 0}
.dot{fill:var(--dot)}
.edge-on{stroke-width:6;stroke-linecap:round}
.halo{stroke-width:16;stroke-linecap:round;stroke-opacity:.18}
.ghost{stroke:var(--cur);stroke-width:6;stroke-linecap:round;opacity:0;transition:opacity .1s}
#board:not(.locked) .edge-free:hover .ghost{opacity:.45}
.hit{stroke:transparent;stroke-width:26;stroke-linecap:round;cursor:pointer}
#board.locked .hit{cursor:default}
.c0{stroke:var(--p0)} .c1{stroke:var(--p1)} .c2{stroke:var(--p2)} .c3{stroke:var(--p3)}
.box rect{fill-opacity:.15;stroke:none}
.box text{font-weight:700;font-size:22px;text-anchor:middle;dominant-baseline:central;stroke:none}
.box.c0 rect,.box.c0 text{fill:var(--p0)} .box.c1 rect,.box.c1 text{fill:var(--p1)}
.box.c2 rect,.box.c2 text{fill:var(--p2)} .box.c3 rect,.box.c3 text{fill:var(--p3)}
.box.new{animation:pop .3s ease-out;transform-box:fill-box;transform-origin:center}
.edge-on.last{animation:fade .25s ease-out}
@keyframes pop{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes fade{from{opacity:.15}to{opacity:1}}
dialog{border:none;border-radius:18px;padding:0;background:var(--panel);color:var(--ink);width:min(560px,calc(100vw - 32px));max-height:calc(100vh - 32px);box-shadow:0 20px 60px rgba(0,0,0,.28)}
dialog::backdrop{background:rgba(12,14,18,.5)}
.dlg{padding:20px 22px}
.dlg h2{margin:0 0 4px;font-size:20px}
.dlg .lead{color:var(--muted);margin:0 0 6px;font-size:14px}
.row{margin:16px 0}
.lbl{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:6px;font-weight:600}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg label{flex:1 1 auto;position:relative}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg span{display:block;text-align:center;padding:8px 10px;border:1px solid var(--line);border-radius:10px;cursor:pointer;font-size:14px;white-space:nowrap}
.seg input:checked+span{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.seg input:focus-visible+span{outline:2px solid var(--p0);outline-offset:2px}
.hint{font-size:13px;color:var(--muted);margin-top:8px;min-height:18px}
.names{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.names input{font:inherit;font-size:14px;padding:7px 10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);min-width:0}
.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}
.big{font-size:40px;font-weight:700;font-variant-numeric:tabular-nums;margin:6px 0}
.list{margin:12px 0 0;padding:0;list-style:none}
.list li{padding:8px 0;border-top:1px solid var(--line);font-size:14px;display:flex;justify-content:space-between;gap:10px}
.list li span:last-child{font-weight:600;white-space:nowrap}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--p0);border-radius:4px}
.metric{padding:10px 0;border-top:1px solid var(--line)}
.metric .top{display:flex;justify-content:space-between;font-size:14px}
.metric .top span:last-child{color:var(--muted)}
.metric .d{font-size:12px;color:var(--muted);margin-top:2px}
table{width:100%;border-collapse:collapse;font-size:14px;margin-top:6px}
th,td{text-align:right;padding:6px 4px;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
th:first-child,td:first-child{text-align:left}
th{color:var(--muted);font-weight:600;font-size:12px}
.insight{font-size:14px;line-height:1.5;background:var(--bg);border-radius:10px;padding:10px 12px;margin-top:8px}
.spark{width:100%;height:60px;margin-top:6px}
.chip{display:inline-block;font-size:12px;padding:2px 8px;border-radius:999px;background:var(--bg);border:1px solid var(--line);color:var(--muted);margin-left:6px}
.field{font:inherit;font-size:15px;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);width:100%}
.linkbox{display:flex;gap:6px;margin-top:12px}
.linkbox input{flex:1;min-width:0}
.wait{display:flex;align-items:center;gap:10px;margin-top:16px;font-size:14px;color:var(--muted)}
.wait::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--p0);animation:pulse 1.2s ease-in-out infinite}
.wait.ok::before{background:var(--p2);animation:none}
.wait.bad::before{background:var(--p1)}
@keyframes pulse{50%{opacity:.25}}
.net{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:middle;background:var(--p2)}
.net.off{background:var(--p1)}
.pl{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:15px}
.pl:first-child{border-top:none}
.pl .dot2{width:9px;height:9px;border-radius:50%;background:var(--p2);flex:none}
.pl .dot2.busy{background:var(--p3)}
.pl .nm2{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl .st2{font-size:13px;color:var(--muted)}
.pl .btn{padding:5px 12px;font-size:14px}
.liveitem{font-size:14px;color:var(--muted);padding:4px 0}
.liveitem b{color:var(--ink)}
.rk td:first-child{width:28px;color:var(--muted)}
.rk td:nth-child(2){text-align:left}
.rk tr.me td{font-weight:700;color:var(--p0)}
.you{font-size:13px;color:var(--muted);margin:2px 0 0}
.you button{border:none;background:none;color:var(--p0);font:inherit;font-size:13px;padding:0;cursor:pointer;text-decoration:underline}
@media (max-width:520px){ .app{padding:12px} .btn .t{display:none} .card{min-width:0;flex:1;padding:8px 12px} .card .score{font-size:24px} h1{font-size:18px} }
</style>

<body>
<div class="app">
  <header>
    <h1>
      <svg class="logo" viewBox="0 0 26 26"><g fill="currentColor"><circle cx="4" cy="4" r="2.5"/><circle cx="22" cy="4" r="2.5"/><circle cx="4" cy="22" r="2.5"/><circle cx="22" cy="22" r="2.5"/></g><path d="M4 4H22V22" stroke="var(--p0)" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M4 4V22H22" stroke="var(--p1)" stroke-width="3" fill="none" stroke-linecap="round"/></svg>
      <span>Linee e quadrettini birichini<small>di Tomelleri Davide per RH group</small></span>
    </h1>
    <div class="tools">
      <button class="btn" id="bUndo" title="Annulla l'ultima mossa"><svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg><span class="t">Annulla</span></button>
      <button class="btn" id="bNew" title="Nuova partita"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span class="t">Nuova</span></button>
      <button class="btn" id="bStats" title="Statistiche"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg><span class="t">Statistiche</span></button>
      <button class="btn icon" id="bSound" title="Suoni"></button>
      <button class="btn icon" id="bTheme" title="Tema chiaro/scuro"></button>
    </div>
  </header>
  <div class="scores" id="scores"></div>

  <div class="board-wrap"><svg id="board" viewBox="0 0 100 100"></svg></div>
</div>

<dialog id="dSetup"><form method="dialog" class="dlg" id="fSetup"></form></dialog>
<dialog id="dEnd"><div class="dlg" id="endBody"></div></dialog>
<dialog id="dStats"><div class="dlg" id="statsBody"></div></dialog>
<dialog id="dLobby"><div class="dlg" id="lobbyBody"></div></dialog>
<dialog id="dInvite"><div class="dlg" id="inviteBody"></div></dialog>

<script>
// ==ENGINE==
// Griglia R x C quadrati. Lati orizzontali: id = r*C + c (r 0..R). Verticali: id = H + r*(C+1) + c (c 0..C).
function makeTopo(R, C) {
  const H = (R + 1) * C, E = H + R * (C + 1), B = R * C;
  const eb = new Int16Array(E * 2).fill(-1), be = new Int16Array(B * 4), geo = [];
  for (let r = 0; r <= R; r++) for (let c = 0; c < C; c++) {
    const e = r * C + c;
    if (r > 0) eb[e * 2] = (r - 1) * C + c;
    if (r < R) eb[e * 2 + 1] = r * C + c;
    geo[e] = [c, r, c + 1, r];
  }
  for (let r = 0; r < R; r++) for (let c = 0; c <= C; c++) {
    const e = H + r * (C + 1) + c;
    if (c > 0) eb[e * 2] = r * C + c - 1;
    if (c < C) eb[e * 2 + 1] = r * C + c;
    geo[e] = [c, r, c, r + 1];
  }
  for (let b = 0; b < B; b++) {
    const r = Math.floor(b / C), c = b % C;
    be[b * 4] = r * C + c; be[b * 4 + 1] = (r + 1) * C + c;
    be[b * 4 + 2] = H + r * (C + 1) + c; be[b * 4 + 3] = H + r * (C + 1) + c + 1;
  }
  return { R, C, H, E, B, eb, be, geo };
}
const newState = T => ({ T, ed: new Uint8Array(T.E), cnt: new Uint8Array(T.B), free: T.E });
const cloneState = st => ({ T: st.T, ed: st.ed.slice(), cnt: st.cnt.slice(), free: st.free });
const ABORT = { abort: true };
const pick = a => a[Math.floor(Math.random() * a.length)];

function play(st, e) {
  st.ed[e] = 1; st.free--;
  let k = 0;
  for (let i = 0; i < 2; i++) { const b = st.T.eb[e * 2 + i]; if (b >= 0 && ++st.cnt[b] === 4) k++; }
  return k;
}
function unplay(st, e) {
  st.ed[e] = 0; st.free++;
  for (let i = 0; i < 2; i++) { const b = st.T.eb[e * 2 + i]; if (b >= 0) st.cnt[b]--; }
}
function otherBox(T, e, b) { return T.eb[e * 2] === b ? T.eb[e * 2 + 1] : T.eb[e * 2]; }
function isSafe(st, e) {
  for (let i = 0; i < 2; i++) { const b = st.T.eb[e * 2 + i]; if (b >= 0 && st.cnt[b] >= 2) return false; }
  return true;
}
function freeEdges(st) { const r = []; for (let e = 0; e < st.T.E; e++) if (!st.ed[e]) r.push(e); return r; }
function safeEdges(st) { const r = []; for (let e = 0; e < st.T.E; e++) if (!st.ed[e] && isSafe(st, e)) r.push(e); return r; }
function freeEdgeOf(st, b, skip = -1) {
  for (let k = 0; k < 4; k++) { const e = st.T.be[b * 4 + k]; if (!st.ed[e] && e !== skip) return e; }
  return -1;
}
function firstCap(st) {
  for (let b = 0; b < st.T.B; b++) if (st.cnt[b] === 3) return freeEdgeOf(st, b);
  return -1;
}
function capEdges(st) {
  const s = new Set();
  for (let b = 0; b < st.T.B; b++) if (st.cnt[b] === 3) s.add(freeEdgeOf(st, b));
  return [...s];
}
function keyOf(st) {
  let s = '';
  for (let i = 0; i < st.T.E; i += 16) {
    let w = 0;
    for (let j = 0; j < 16 && i + j < st.T.E; j++) if (st.ed[i + j]) w |= 1 << j;
    s += String.fromCharCode(w);
  }
  return s;
}
// Mosse "doppio incrocio": invece di prendere, si lasciano 2 quadrati (catena) o 4 (anello) all'avversario.
function ddCandidates(st) {
  const T = st.T, out = new Set();
  for (let a = 0; a < T.B; a++) {
    if (st.cnt[a] !== 3) continue;
    const e = freeEdgeOf(st, a), b = otherBox(T, e, a);
    if (b < 0 || st.cnt[b] !== 2) continue;
    const f = freeEdgeOf(st, b, e);
    if (f < 0) continue;
    const o = otherBox(T, f, b);
    if (o >= 0 && st.cnt[o] >= 3) continue;
    out.add(f);
  }
  return [...out];
}
// Fase finale senza mosse sicure e senza catture: scompone in catene e anelli.
function analyze(st) {
  const T = st.T, seen = new Uint8Array(T.B), comps = [];
  for (let b = 0; b < T.B; b++) if (st.cnt[b] < 2) return { simple: false, comps };
  for (let b = 0; b < T.B; b++) {
    if (st.cnt[b] !== 2 || seen[b]) continue;
    const stack = [b], edges = new Set(); seen[b] = 1;
    let n = 0, ground = 0;
    while (stack.length) {
      const x = stack.pop(); n++;
      for (let k = 0; k < 4; k++) {
        const e = T.be[x * 4 + k];
        if (st.ed[e]) continue;
        if (edges.has(e)) continue;
        edges.add(e);
        const o = otherBox(T, e, x);
        if (o < 0) ground++;
        else if (!seen[o]) { seen[o] = 1; stack.push(o); }
      }
    }
    comps.push({ len: n, loop: ground === 0, edges: [...edges] });
  }
  return { simple: true, comps };
}
function openEdge(T, c) {
  if (c.loop) return c.edges[0];
  if (c.len === 2) return c.edges.find(e => T.eb[e * 2] >= 0 && T.eb[e * 2 + 1] >= 0) ?? c.edges[0];
  return c.edges.find(e => T.eb[e * 2] < 0 || T.eb[e * 2 + 1] < 0) ?? c.edges[0];
}
function uniqueComps(comps) {
  const seen = new Set();
  return comps.filter(c => { const k = (c.loop ? 'l' : 'c') + c.len; if (seen.has(k)) return false; seen.add(k); return true; });
}
// Quanti quadrati incassa l'avversario (avido) se gioco e.
function greedyGain(st, e) {
  const stack = [e]; play(st, e);
  let tot = 0, c;
  while ((c = firstCap(st)) >= 0) { tot += play(st, c); stack.push(c); }
  while (stack.length) unplay(st, stack.pop());
  return tot;
}
function fewestGiven(st) {
  let best = Infinity, list = [];
  for (const e of freeEdges(st)) {
    const g = greedyGain(st, e);
    if (g < best) { best = g; list = [e]; } else if (g === best) list.push(e);
  }
  return pick(list);
}
function features(s) {
  return {
    missCap: s < 15 ? 0.45 : s < 30 ? 0.12 : 0,
    avoid3: Math.min(1, Math.max(0, (s - 5) / 35)),
    smartGive: s >= 20,
    endSmart: s >= 40,
    ddKnow: s >= 55,
    exactT: s >= 70 ? Math.round(3 + (s - 70) / 30 * 11) : 0,
    blunder: s >= 85 ? 0 : (85 - s) / 400,
    altDepth: s >= 90 ? 6 : s >= 60 ? 4 : 0,
    altFree: s >= 90 ? 30 : 22,
  };
}
// Risolutore con valori dal punto di vista del computer (+ = buono per il computer).
// model: probabilita' che l'umano giochi la mossa ottimale nelle tre situazioni chiave (null = sempre ottimale).
function makeSolver(model, budget, ms = Infinity) {
  const qDD = model ? model.qDD : 1, qEnd = model ? model.qEnd : 1, qCtrl = model ? model.qCtrl : 1;
  const mC = new Map(), mE = new Map(), mS = new Map();
  let nodes = 0;
  const deadline = Date.now() + ms;
  const tick = () => { if (++nodes > budget || ((nodes & 511) === 0 && Date.now() > deadline)) throw ABORT; };
  function mix(vals, ai, q) {
    let mn = Infinity, mx = -Infinity, sum = 0;
    for (const v of vals) { if (v < mn) mn = v; if (v > mx) mx = v; sum += v; }
    return ai ? mx : q * mn + (1 - q) * sum / vals.length;
  }
  function respond(take, dd, responderAI) {
    if (responderAI) return Math.max(take, dd);
    return qDD * Math.min(take, dd) + (1 - qDD) * take;
  }
  function vClosed(chains, loops, ai) {
    if (!chains.length && !loops.length) return 0;
    const key = (ai ? 'A' : 'H') + chains.join(',') + '|' + loops.join(',');
    const hit = mC.get(key); if (hit !== undefined) return hit;
    tick();
    const s = ai ? 1 : -1, opts = [];
    for (let i = 0; i < chains.length; i++) {
      if (i && chains[i] === chains[i - 1]) continue;
      const L = chains[i], rest = chains.slice(0, i).concat(chains.slice(i + 1));
      const take = -s * L + vClosed(rest, loops, !ai);
      opts.push(L >= 3 ? respond(take, s * (4 - L) + vClosed(rest, loops, ai), !ai) : take);
    }
    for (let i = 0; i < loops.length; i++) {
      if (i && loops[i] === loops[i - 1]) continue;
      const L = loops[i], rest = loops.slice(0, i).concat(loops.slice(i + 1));
      const take = -s * L + vClosed(chains, rest, !ai);
      opts.push(respond(take, s * (8 - L) + vClosed(chains, rest, ai), !ai));
    }
    const v = mix(opts, ai, qEnd);
    mC.set(key, v); return v;
  }
  function closedValue(st, ai) {
    const an = analyze(st);
    if (an.simple) {
      const ch = an.comps.filter(c => !c.loop).map(c => c.len).sort((a, b) => a - b);
      const lp = an.comps.filter(c => c.loop).map(c => c.len).sort((a, b) => a - b);
      return vClosed(ch, lp, ai);
    }
    const vals = [];
    for (const e of freeEdges(st)) { play(st, e); vals.push(gEnd(st, !ai)); unplay(st, e); }
    return mix(vals, ai, qEnd);
  }
  // Nessuna mossa sicura rimasta.
  function gEnd(st, ai) {
    if (st.free === 0) return 0;

    scores: players.map(() => 0), turn: 0, players, rule, history: [], over: false,
    lastEdge: -1, newBoxes: [], vsAI: false, online: false, level: null, startStrength: store.profile.strength,

function recordOnline() {
  const gid = net && net.cfg && net.cfg.gid, O = store.online;
  if (!gid || O.seen.includes(gid)) return;
  O.seen.push(gid); if (O.seen.length > 300) O.seen.shift();
  const me = game.players.findIndex(p => p.kind === 'human'), op = 1 - me;
  const a = game.scores[me], b = game.scores[op], opp = game.players[op].name, res = a > b ? 'w' : a < b ? 'l' : 'd';
  const v = O.vs[opp] || (O.vs[opp] = { w: 0, l: 0, d: 0, pf: 0, pa: 0 });
  v[res]++; v.pf += a; v.pa += b;
  O.games.unshift({ t: Date.now(), opp, a, b, res, size: game.T.R });
  if (O.games.length > 50) O.games.length = 50;
  saveStore();
  const c = net.cfg, host = net.role === 'host', rm = host ? c.rh : c.rg, ro = host ? c.rg : c.rh;
  if (typeof rm === 'number' && typeof ro === 'number') {
    const exp = 1 / (1 + Math.pow(10, (ro - rm) / 400)), sc = res === 'w' ? 1 : res === 'd' ? 0.5 : 0;
    const delta = Math.round(32 * (sc - exp));
    game.elo = { delta, rating: Math.max(0, rm + delta) };

  hubRecord({ gid, opp, a, b, res, size: game.T.R, delta: game.elo ? game.elo.delta : 0 });
}

async function hostOnline(resume) {
  try { await loadPeerJS(); } catch { alert('Non riesco a caricare la parte online del gioco. Controlla la connessione a Internet.'); return; }
  net = resume || { role: 'host', code: randCode(), name: (store.settings.myName || '').trim() || 'Giocatore 1', cfg: null, guestToken: null };
  net.role = 'host'; net.synced = false;

  history.replaceState(null, '', '#p=' + net.code);
  saveOnline();
  createHostPeer(); hostRelay();

}
function createHostPeer() {
  if (!net) return;
  if (net.peer && !net.peer.destroyed) net.peer.destroy();
  const peer = new Peer(PEER_PREFIX + net.code);
  net.peer = peer; net.ready = false;
  const mine = () => net && net.peer === peer;
  peer.on('open', () => { if (mine()) { net.ready = true; updateLobby(); if (net.challenge && !net.cfg) hubSendInvite(); } });
  peer.on('connection', conn => {
    conn.on('data', d => { if (mine()) hostRecv(conn, d); });
    conn.on('close', () => { if (mine() && net.conn === conn) { net.conn = null; net.synced = false; setConn(); } });
  });
  peer.on('disconnected', () => setTimeout(() => { if (mine() && !peer.destroyed && peer.disconnected) peer.reconnect(); }, 1500));
  peer.on('error', err => {
    if (!mine()) return;
    if (err.type === 'unavailable-id') { net.ready = false; updateLobby(); setTimeout(() => { if (mine()) createHostPeer(); }, 4000); }
    else if (['network', 'server-error', 'socket-error', 'socket-closed'].includes(err.type))
      setTimeout(() => { if (!mine()) return; if (peer.destroyed) createHostPeer(); else if (peer.disconnected) peer.reconnect(); }, 3000);
  });
}
function hostRecv(conn, d) {

    if (net.conn && net.conn !== conn) try { net.conn.close(); } catch {}
    net.conn = conn; net.guestToken = d.token;
    const guestName = (d.name || '').trim() || 'Amico';
    if (!net.cfg) {
      const S = store.settings, hostFirst = Math.random() < 0.5;
      net.cfg = { size: +S.size, rule: S.rule, host: net.name, guest: guestName, hostFirst, gid: randCode(8), rh: myRating(), rg: Number.isFinite(d.rating) ? d.rating : 1000 };
      hubClearInvite();
      startOnlineGame([]);
      if ($('#dLobby').open) $('#dLobby').close();
      beep(660, 0.1, 0.05);
    } else if (net.cfg.guest !== guestName) {
      net.cfg.guest = guestName;
      startOnlineGame(game.history.map(h => h.e));
    }
    net.synced = true; sendSync(); saveOnline(); setConn();
    return;
  }
  if (conn !== net.conn) return;

    const RES = { w: 'Vinta', l: 'Persa', d: 'Pari' };
    const last = Object.values(me.games || {}).sort((a, b) => b.t - a.t).slice(0, 10);
    body = `<div class="row"><div class="lbl">Il tuo punteggio</div><div class="big">${Math.round(me.rating)}<span style="font-size:16px;color:var(--muted)"> punti · ${rank}° su ${list.length}</span></div>
      ${n > 1 ? `<svg class="spark" viewBox="0 0 300 60" preserveAspectRatio="none"><polyline points="${pts}" fill="none" stroke="var(--p0)" stroke-width="2" vector-effect="non-scaling-stroke"/></svg><div class="hint">Sale quando vinci e scende quando perdi: battere chi è più forte di te vale di più.</div>` : '<div class="hint">La curva dei tuoi progressi apparirà dopo le prime partite.</div>'}</div>
      <div class="row"><div class="lbl">Partite</div><div class="big">${me.w || 0}<span style="font-size:16px;color:var(--muted)"> vinte · ${me.l || 0} perse · ${me.d || 0} pari</span></div></div>
      ${vs.length ? `<div class="row"><div class="lbl">Contro i tuoi avversari</div><table><tr><th>Avversario</th><th>Vinte</th><th>Perse</th><th>Pari</th><th>Quadrati</th></tr>${vs.map(v => `<tr><td>${esc(v.name)}</td><td>${v.w}</td><td>${v.l}</td><td>${v.d}</td><td>${v.pf}–${v.pa}</td></tr>`).join('')}</table></div>` : ''}
      ${last.length ? `<div class="row"><div class="lbl">Ultime partite</div><ul class="list">${last.map(g => `<li><span>${new Date(g.t).toLocaleDateString('it-IT', { day: '2-digit', month: '2-digit' })} · contro ${esc(g.opp)} · ${g.size}×${g.size}</span><span>${g.a}–${g.b} ${RES[g.res]}</span></li>`).join('')}</ul></div>` : ''}`;
  }
  $('#statsBody').innerHTML = `<h2>${statsTab === 'rank' ? 'Classifica' : 'Statistiche di ' + mn}</h2>${tabs}${body}<div class="actions"><button class="btn primary" id="sClose">Chiudi</button></div>`;
  $('#statsBody').querySelectorAll('input[name=stab]').forEach(i => i.onchange = () => { statsTab = i.value; openStatsWeb(); });
  $('#sClose').onclick = () => $('#dStats').close();
  if (!$('#dStats').open) $('#dStats').showModal();
}

// ---- avvio ----
if (WEB) store.settings.mode = 'online';
applyPrefs(); render();
(() => {
  startHub();
  const code = (location.hash.match(/^#p=([a-z0-9]+)$/) || [])[1];
  const saved = loadOnline();
  if (code && saved && saved.code === code && saved.cfg) {
    if (saved.role === 'host') hostOnline(saved); else joinOnline(code, saved);
  } else if (code && saved && saved.code === code && saved.role === 'host') hostOnline(saved);
  else if (code) openJoin(code);
  else if (WEB && !(store.settings.myName || '').trim()) askName(() => { startHub(); openSetup(); });
  else openSetup();
})();
</script>
</body>
</html>
